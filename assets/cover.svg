<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="4" fill="#39c5cf"/>

  <text x="56" y="148" font-size="46" font-weight="700" fill="#e6edf3">context<tspan fill="#39c5cf">-budgeter</tspan></text>
  <text x="58" y="190" font-size="17" fill="#c9d1d9">Fit a chat history into the context window</text>
  <text x="58" y="220" font-size="15" fill="#8b949e">bring your own counter · never over budget</text>

  <g font-size="15" fill="#c9d1d9">
    <rect x="56" y="254" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="131" y="276" text-anchor="middle">zero-dependency</text>
    <rect x="216" y="254" width="140" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="286" y="276" text-anchor="middle">any tokenizer</text>
    <rect x="366" y="254" width="80" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="406" y="276" text-anchor="middle">~1 kB</text>
  </g>

  <text x="58" y="342" font-size="17"><tspan fill="#39c5cf">$</tspan> <tspan fill="#c9d1d9">npm install context-budgeter</tspan></text>

  <rect x="512" y="56" width="432" height="308" rx="12" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="512" y="56" width="432" height="38" rx="12" fill="#161b22"/>
  <rect x="512" y="82" width="432" height="12" fill="#161b22"/>
  <circle cx="534" cy="75" r="5.5" fill="#ff5f56"/>
  <circle cx="553" cy="75" r="5.5" fill="#ffbd2e"/>
  <circle cx="572" cy="75" r="5.5" fill="#27c93f"/>
  <text x="728" y="80" text-anchor="middle" font-size="12" fill="#8b949e">chat history · 7,120 → 4,000 tokens</text>

  <text x="532" y="128" font-size="13" fill="#6e7681">// keep what matters, fit the window</text>
  <text x="532" y="156" font-size="14" fill="#39c5cf">fit(history, { budget, count })</text>

  <text x="532" y="194" font-size="13"><tspan fill="#3fb950">✓ keep</tspan><tspan fill="#8b949e"> system + last 4 turns</tspan></text>
  <text x="532" y="222" font-size="13"><tspan fill="#6e7681">✕ drop 6 old turns (middle-out)</tspan></text>
  <text x="532" y="250" font-size="13"><tspan fill="#8b949e">tokens </tspan><tspan fill="#39c5cf">3,980 / 4,000</tspan></text>

  <text x="532" y="296" font-size="13"><tspan fill="#3fb950">✓ fits</tspan><tspan fill="#6e7681">  ·  nothing pinned was lost</tspan></text>
</svg>
