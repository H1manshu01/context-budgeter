<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#39c5cf"/>

  <text x="80" y="248" font-size="60" font-weight="700" fill="#e6edf3">context<tspan fill="#39c5cf">-budgeter</tspan></text>
  <text x="82" y="302" font-size="24" fill="#c9d1d9">Fit a chat history into the context window</text>
  <text x="82" y="338" font-size="19" fill="#8b949e">bring your own counter · never over budget</text>

  <g font-size="18" fill="#c9d1d9">
    <rect x="80" y="374" width="196" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="402" text-anchor="middle">zero-dependency</text>
    <rect x="288" y="374" width="176" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="402" text-anchor="middle">any tokenizer</text>
    <rect x="476" y="374" width="96" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="524" y="402" text-anchor="middle">~1 kB</text>
  </g>

  <text x="82" y="506" font-size="24"><tspan fill="#39c5cf">$</tspan> <tspan fill="#c9d1d9">npm install context-budgeter</tspan></text>

  <rect x="700" y="96" width="500" height="448" rx="14" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="700" y="96" width="500" height="46" rx="14" fill="#161b22"/>
  <rect x="700" y="128" width="500" height="14" fill="#161b22"/>
  <circle cx="726" cy="119" r="6.5" fill="#ff5f56"/>
  <circle cx="748" cy="119" r="6.5" fill="#ffbd2e"/>
  <circle cx="770" cy="119" r="6.5" fill="#27c93f"/>
  <text x="975" y="124" text-anchor="middle" font-size="14" fill="#8b949e">chat history · 7,120 → 4,000 tokens</text>

  <text x="724" y="190" font-size="15" fill="#6e7681">// keep what matters, fit the window</text>
  <text x="724" y="224" font-size="17" fill="#39c5cf">fit(history, { budget, count })</text>

  <text x="724" y="266" font-size="16"><tspan fill="#3fb950">✓ keep</tspan><tspan fill="#8b949e"> system + last 4 turns</tspan></text>
  <text x="724" y="300" font-size="16"><tspan fill="#6e7681">✕ drop 6 old turns (middle-out)</tspan></text>
  <text x="724" y="334" font-size="16"><tspan fill="#8b949e">tokens </tspan><tspan fill="#39c5cf">3,980 / 4,000</tspan></text>

  <text x="724" y="400" font-size="15"><tspan fill="#3fb950">✓ fits</tspan><tspan fill="#6e7681">  ·  nothing pinned was lost, order kept</tspan></text>
</svg>
